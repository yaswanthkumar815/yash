<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Modern Java 21 Task Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #8b5cf6;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --warning: #f59e0b;
      --urgent: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    .brand h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.7rem 1.25rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent-color, var(--primary));
    }

    .stat-card h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card .val {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 0.3rem;
    }

    .controls-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .select-box select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: white;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .tab-group {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-item {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .task-item:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .task-item.completed {
      opacity: 0.65;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .task-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: 700;
      display: none;
    }

    .task-item.completed .checkbox::after {
      display: block;
    }

    .task-body {
      flex: 1;
    }

    .task-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
      flex-wrap: wrap;
    }

    .task-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-low { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-medium { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-high { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-urgent { background: rgba(236, 72, 153, 0.2); color: #f472b6; }

    .task-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .task-meta {
      font-size: 0.75rem;
      color: #64748b;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 6px;
      transition: color 0.15s ease, background 0.15s ease;
      font-size: 1.1rem;
    }

    .btn-icon:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }

    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 1.75rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .modal-header h2 {
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.7rem;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-secondary {
      background: #334155;
      color: white;
    }
    .btn-secondary:hover {
      background: #475569;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 0.8rem 1.4rem;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 0.9rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <h1>TaskFlow</h1>
          <p>Java 21 Virtual Threads &bull; REST API &bull; Live UI</p>
        </div>
      </div>
      <button class="btn" onclick="openModal()">
        <span>+</span> Add New Task
      </button>
    </header>

    <!-- Stats Overview -->
    <div class="stats-grid">
      <div class="stat-card" style="--accent-color: var(--primary);">
        <h3>Total Tasks</h3>
        <div class="val" id="stat-total">0</div>
      </div>
      <div class="stat-card" style="--accent-color: var(--warning);">
        <h3>Pending</h3>
        <div class="val" id="stat-pending">0</div>
      </div>
      <div class="stat-card" style="--accent-color: var(--success);">
        <h3>Completed</h3>
        <div class="val" id="stat-completed">0</div>
      </div>
      <div class="stat-card" style="--accent-color: var(--urgent);">
        <h3>Urgent</h3>
        <div class="val" id="stat-urgent">0</div>
      </div>
    </div>

    <!-- Filters & Controls -->
    <div class="controls-card">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search tasks..." oninput="handleSearch()">
      </div>
      <div class="select-box">
        <select id="priorityFilter" onchange="handleSearch()">
          <option value="">All Priorities</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="URGENT">Urgent</option>
        </select>
      </div>
      <div class="tab-group">
        <button class="tab-btn active" onclick="setTab('all', this)">All</button>
        <button class="tab-btn" onclick="setTab('pending', this)">Pending</button>
        <button class="tab-btn" onclick="setTab('completed', this)">Completed</button>
      </div>
    </div>

    <!-- Tasks List Container -->
    <div class="task-list" id="taskList">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Create New Task</h2>
        <button class="btn-icon" onclick="closeModal()">✕</button>
      </div>
      <form id="createTaskForm" onsubmit="handleCreateTask(event)">
        <div class="form-group">
          <label for="taskTitle">Task Title *</label>
          <input type="text" id="taskTitle" required placeholder="e.g. Implement caching layer">
        </div>
        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" placeholder="Details about this task..."></textarea>
        </div>
        <div class="form-group">
          <label for="taskPriority">Priority</label>
          <select id="taskPriority">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="URGENT">Urgent</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Message -->
  <div class="toast" id="toast"></div>

  <script>
    let currentTab = 'all';
    let tasks = [];

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        if (res.ok) {
          const stats = await res.json();
          document.getElementById('stat-total').textContent = stats.total ?? 0;
          document.getElementById('stat-pending').textContent = stats.pending ?? 0;
          document.getElementById('stat-completed').textContent = stats.completed ?? 0;
          document.getElementById('stat-urgent').textContent = stats.urgent ?? 0;
        }
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }

    async function loadTasks() {
      try {
        const query = document.getElementById('searchInput').value.trim();
        const priority = document.getElementById('priorityFilter').value;
        let url = `/api/tasks?`;
        if (query) url += `search=${encodeURIComponent(query)}&`;
        if (priority) url += `priority=${encodeURIComponent(priority)}&`;
        if (currentTab === 'pending') url += `completed=false&`;
        if (currentTab === 'completed') url += `completed=true&`;

        const res = await fetch(url);
        if (res.ok) {
          tasks = await res.json();
          renderTasks();
        }
      } catch (err) {
        console.error('Failed to load tasks:', err);
      }
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <h3>No tasks found</h3>
            <p>Create a new task to get started!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = tasks.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${task.id}">
          <div class="checkbox" onclick="toggleTask(${task.id})"></div>
          <div class="task-body">
            <div class="task-header">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <span class="badge badge-${task.priority.toLowerCase()}">${task.priority}</span>
            </div>
            ${task.description ? `<p class="task-desc">${escapeHtml(task.description)}</p>` : ''}
            <div class="task-meta">Created on ${task.createdAt || 'Just now'}</div>
          </div>
          <div class="task-actions">
            <button class="btn-icon" title="Delete Task" onclick="deleteTask(${task.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    async function toggleTask(id) {
      try {
        const res = await fetch(`/api/tasks/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });
        if (res.ok) {
          showToast('✅ Task status updated');
          await loadTasks();
          await loadStats();
        }
      } catch (err) {
        showToast('❌ Error updating task');
      }
    }

    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        const res = await fetch(`/api/tasks/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });
        if (res.ok) {
          showToast('🗑️ Task deleted');
          await loadTasks();
          await loadStats();
        }
      } catch (err) {
        showToast('❌ Error deleting task');
      }
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('taskTitle').value.trim();
      const description = document.getElementById('taskDesc').value.trim();
      const priority = document.getElementById('taskPriority').value;

      if (!title) return;

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, priority })
        });

        if (res.ok) {
          closeModal();
          showToast('🎉 Task created successfully!');
          document.getElementById('createTaskForm').reset();
          await loadTasks();
          await loadStats();
        } else {
          showToast('❌ Failed to create task');
        }
      } catch (err) {
        showToast('❌ Network error creating task');
      }
    }

    function setTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadTasks();
    }

    function handleSearch() {
      loadTasks();
    }

    function openModal() {
      document.getElementById('taskModal').style.display = 'flex';
      document.getElementById('taskTitle').focus();
    }

    function closeModal() {
      document.getElementById('taskModal').style.display = 'none';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial load & poll every 5s for multi-device sync
    loadStats();
    loadTasks();
    setInterval(() => {
      loadStats();
    }, 5000);
  </script>
</body>
</html>
